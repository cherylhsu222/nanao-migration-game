<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>舊部落找新家｜南澳遷徙小遊戲</title>
<meta name="description" content="8 個山裡的舊部落，族人搬到了山下哪裡？比對族語名門牌、打聽村落消息，收集星星與故事卡。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>
<style>
:root {
  --paper: #f3f1e9;
  --card: #fbf8ee;
  --ink: #435348;
  --ink-2: #5e6a5f;
  --muted: #8a9184;
  --line: rgba(67,83,72,.16);
  --accent: #b27745;
  --old: #a8743f;
  --current: #3f82a6;
  --ok: #5f9a4c;
  --bad: #b85a48;
  --star: #d99a3e;
  --serif: 'Noto Serif TC', 'Songti TC', serif;
  --sans: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  --latin: Georgia, 'Times New Roman', serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { background: var(--paper); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
h1, h2, h3, p { margin: 0; }
[hidden] { display: none !important; }
mark { background: #f3dcb2; color: inherit; border-radius: 3px; padding: 0 1px; }

#map { position: fixed; inset: 0; background: #dce5e3; }
.maplibregl-ctrl-attrib { font-size: 10px !important; background: rgba(243,241,233,.7) !important; }
.maplibregl-ctrl-top-right { top: 64px !important; }

.btn-main { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 28px; border-radius: 999px; background: var(--ink); color: #fbf8ee; font-size: 16px; font-weight: 600; letter-spacing: .08em; box-shadow: 0 10px 24px rgba(40,55,45,.22); transition: transform .15s ease, background .2s ease; }
.btn-main:hover { background: #34433a; transform: translateY(-2px); }
.btn-main:active { transform: translateY(1px) scale(.98); }
.btn-main.small { padding: 11px 20px; font-size: 15px; }
.btn-ghost { display: inline-flex; align-items: center; justify-content: center; padding: 13px 26px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); font-size: 16px; font-weight: 600; letter-spacing: .06em; }
.btn-ghost.small { padding: 10px 18px; font-size: 14px; }
.btn-ghost:hover { background: #e6ebe2; }

/* ─── 全螢幕畫面（開場、過場） ─── */
.screen { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; padding: 16px; overflow-y: auto; background: rgba(243,241,233,.88); backdrop-filter: blur(4px); }
.intro-card { width: min(580px, 100%); margin: auto; text-align: center; animation: rise .5s ease; }
.eyebrow { font-size: 12px; letter-spacing: .22em; color: var(--muted); }
.intro-card h1 { margin-top: 14px; font: 700 clamp(38px, 7vw, 56px)/1.2 var(--serif); letter-spacing: .1em; }
.intro-card .lead { margin-top: 18px; font: 400 17px/1.9 var(--serif); color: var(--ink-2); }
.howto { margin: 28px 0 32px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.howto div { padding: 16px 10px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 6px 18px rgba(40,55,45,.06); }
.howto b { display: grid; place-items: center; width: 34px; height: 34px; margin: 0 auto 8px; border-radius: 50%; background: var(--ink); color: #fbf8ee; font: 600 15px/1 var(--serif); }
.howto span { font-size: 14px; line-height: 1.6; color: var(--ink-2); }
.howto em { font-style: normal; color: var(--star); font-weight: 600; }
.level-tag { display: inline-block; padding: 6px 16px; border-radius: 999px; background: var(--accent); color: #fbf8ee; font-size: 13px; font-weight: 600; letter-spacing: .18em; }
.example { margin: 24px auto 0; max-width: 420px; padding: 16px 18px; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 14px; font-size: 14px; line-height: 1.8; color: var(--ink-2); }
.example b { color: var(--ink); }

/* ─── 上方狀態列 ─── */
.hud { position: fixed; top: 12px; left: 12px; right: 12px; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 10px; pointer-events: none; }
.hud > * { pointer-events: auto; }
.hud-pill { display: flex; align-items: center; gap: 12px; padding: 9px 16px; background: rgba(251,248,238,.95); border: 1px solid var(--line); border-radius: 999px; box-shadow: 0 6px 18px rgba(40,55,45,.12); font-size: 14px; font-weight: 600; letter-spacing: .04em; white-space: nowrap; }
.pips { display: flex; gap: 5px; align-items: center; }
.pips i { width: 9px; height: 9px; border-radius: 50%; background: #d9ddd2; transition: background .3s ease, transform .3s ease; }
.pips i.done { background: var(--ok); }
.pips i.now { background: var(--accent); transform: scale(1.35); }
.pips .gap { width: 1px; height: 12px; margin: 0 3px; background: rgba(67,83,72,.25); }
.score { color: var(--star); font-size: 16px; }
.score.bump { animation: bump .5s ease; }
.streak { color: var(--bad); font-size: 13px; }
@keyframes bump { 0%,100% { transform: none; } 40% { transform: scale(1.35); } }

/* ─── 任務卡 ─── */
.mission { position: fixed; left: 16px; bottom: 16px; z-index: 10; width: min(400px, calc(100vw - 32px)); max-height: calc(100svh - 110px); overflow-y: auto; padding: 18px; background: rgba(251,248,238,.97); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 18px 44px rgba(40,55,45,.2); }
.mission.enter { animation: slideup .45s cubic-bezier(.2,.8,.2,1); }
.mission.shake { animation: shake .42s ease; }
@keyframes slideup { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: none; } }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes shake { 0%,100% { transform: none; } 20% { transform: translateX(-7px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
.mission-top { display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; }
.mission-top img { width: 64px; height: 64px; object-fit: cover; border-radius: 12px; background: #e3e6dc; }
.mission-top small { font-size: 11px; letter-spacing: .16em; color: var(--accent); font-weight: 600; }
.mission-top h2 { margin-top: 2px; font: 600 22px/1.3 var(--serif); letter-spacing: .04em; }
.round-stars { display: flex; gap: 2px; font-size: 20px; line-height: 1; }
.round-stars span { color: var(--star); transition: color .3s ease, transform .3s ease; }
.round-stars span.lost { color: #c9cec0; transform: scale(.85); }
.nameplate { margin-top: 14px; padding: 14px 16px; text-align: center; border-radius: 14px; background: #f1e6d4; border: 1.5px solid rgba(168,116,63,.35); }
.nameplate small { display: block; font-size: 12px; letter-spacing: .16em; color: #8a6038; }
.nameplate strong { display: block; margin-top: 4px; font: 700 30px/1.2 var(--latin); letter-spacing: .06em; color: #6b4524; }
.task { margin-top: 12px; font: 600 15px/1.7 var(--serif); color: var(--ink); }
.task em { font-style: normal; color: var(--current); }
.toast { margin-top: 10px; padding: 10px 13px; border-radius: 12px; font-size: 14px; line-height: 1.7; background: #f8e9e3; color: #7c3a2c; animation: rise .3s ease; }
.toast.good { background: #e8f0e2; color: #3d6a2c; }

/* 村落名片（第二關） */
.vcard { margin-top: 12px; padding: 14px 16px; border-radius: 14px; background: #e9eff0; border: 1px solid rgba(63,130,166,.25); animation: rise .3s ease; }
.vcard-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.vcard-head b { font: 700 19px/1.3 var(--serif); color: #2f6584; }
.vcard-head span { font: italic 600 14px/1.3 var(--latin); color: #2f6584; }
.vcard p { margin-top: 8px; font-size: 14px; line-height: 1.8; color: var(--ink-2); }
.vcard .roster { margin-top: 10px; padding-top: 10px; border-top: 1px dashed rgba(63,130,166,.3); font-size: 13px; color: var(--ink-2); }
.vcard .roster b { color: var(--ink); }
.vcard .btns { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
.visited { margin-top: 10px; font-size: 12px; color: var(--muted); }
/* 手機版：門牌排在任務卡裡直接點 */
.plates { display: none; margin-top: 10px; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.plates button { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; padding: 8px 10px; border-radius: 10px; background: #e9eff0; border: 1px solid rgba(63,130,166,.25); text-align: left; }
.plates button b { font: 600 13px/1.3 var(--serif); color: var(--ink); }
.plates button em { font: italic 600 13px/1.3 var(--latin); color: #2f6584; }
.plates button.seen { background: #dde7ea; }
.plates button.seen b::after { content: ' ✓'; color: var(--ok); }
.plates button.viewing { background: #2f6584; }
.plates button.viewing b, .plates button.viewing em { color: #fbf8ee; }

/* ─── 地圖標記：村落門牌 ─── */
/* 標記元素不能設 position，否則會蓋掉 MapLibre 的絕對定位，點會偏離真實座標 */
.village { width: 24px; height: 24px; }
.village i { display: block; width: 24px; height: 24px; border-radius: 50%; background: var(--current); border: 3px solid #fbf8ee; box-shadow: 0 0 0 5px rgba(63,130,166,.22), 0 4px 10px rgba(40,55,45,.25); transition: transform .2s ease, box-shadow .2s ease, background .2s ease; }
.village .plate { position: absolute; left: 50%; top: calc(100% + 5px); transform: translateX(-50%); padding: 3px 10px 4px; text-align: center; background: rgba(251,248,238,.97); border-radius: 10px; box-shadow: 0 2px 8px rgba(40,55,45,.18); white-space: nowrap; transition: box-shadow .2s ease, background .2s ease; }
.village .plate b { display: block; font: 600 13px/1.3 var(--serif); letter-spacing: .06em; color: var(--ink); }
.village .plate em { display: block; font: italic 600 13px/1.25 var(--latin); color: #2f6584; letter-spacing: .02em; }
.village.lbl-left .plate { left: auto; right: calc(100% + 6px); top: 50%; transform: translateY(-50%); }
.village.lbl-up .plate { top: auto; bottom: calc(100% + 5px); }
.village.lbl-right .plate { left: calc(100% + 6px); top: 50%; transform: translateY(-50%); }
.village:hover i, .village:focus-visible i { transform: scale(1.2); }
.village:hover .plate, .village:focus-visible .plate { box-shadow: 0 0 0 2px var(--current), 0 2px 8px rgba(40,55,45,.18); }
.playing .village i { animation: breathe 2s ease-in-out infinite; }
.village.is-viewing i { background: #2f6584; transform: scale(1.25); }
.village.is-viewing .plate { box-shadow: 0 0 0 2px #2f6584, 0 4px 12px rgba(40,55,45,.2); }
.village.is-seen i::after { content: '✓'; display: grid; place-items: center; height: 100%; font-size: 11px; font-weight: 700; color: #fbf8ee; }
.village.is-wrong i { background: var(--bad); box-shadow: 0 0 0 8px rgba(184,90,72,.3); animation: shake .42s ease !important; }
.village.is-correct i { background: var(--ok); box-shadow: 0 0 0 10px rgba(95,154,76,.3); animation: none !important; }
.village.is-hint i { box-shadow: 0 0 0 12px rgba(217,154,62,.45); animation: hint 1s ease-in-out infinite !important; }
@keyframes breathe { 0%,100% { box-shadow: 0 0 0 5px rgba(63,130,166,.22), 0 4px 10px rgba(40,55,45,.25); } 50% { box-shadow: 0 0 0 10px rgba(63,130,166,.1), 0 4px 10px rgba(40,55,45,.25); } }
@keyframes hint { 0%,100% { transform: scale(1); } 50% { transform: scale(1.35); } }

.old-dot { width: 14px; height: 14px; pointer-events: none; }
.old-dot i { display: block; width: 14px; height: 14px; border-radius: 50%; background: var(--old); border: 2px solid #fbf8ee; opacity: 0; transition: opacity .3s ease, transform .3s ease; }
.old-dot span { position: absolute; left: 50%; bottom: calc(100% + 8px); transform: translateX(-50%); padding: 4px 11px; font: 600 13px/1.3 var(--serif); color: #fbf8ee; background: var(--old); border-radius: 999px; white-space: nowrap; opacity: 0; transition: opacity .3s ease; box-shadow: 0 4px 12px rgba(40,55,45,.2); }
.old-dot span::after { content: ''; position: absolute; left: 50%; top: 100%; transform: translateX(-50%); border: 5px solid transparent; border-top-color: var(--old); }
.old-dot.is-solved i { opacity: .8; }
.old-dot.is-active i { opacity: 1; transform: scale(1.4); animation: ping 1.6s ease-out infinite; }
.old-dot.is-active span { opacity: 1; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(168,116,63,.55); } 100% { box-shadow: 0 0 0 18px rgba(168,116,63,0); } }

.walker { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; background: var(--accent); border: 3px solid #fbf8ee; box-shadow: 0 6px 16px rgba(40,55,45,.35); }
.walker.spark { width: 18px; height: 18px; background: #5f7d8c; border-width: 3px; box-shadow: 0 0 0 6px rgba(95,125,140,.25), 0 0 18px rgba(95,125,140,.6); }
.walker.spark svg { display: none; }
.route-legend { position: fixed; right: 16px; bottom: 34px; z-index: 9; display: flex; gap: 14px; padding: 8px 14px; font-size: 12px; color: var(--ink-2); background: rgba(251,248,238,.94); border: 1px solid var(--line); border-radius: 999px; box-shadow: 0 4px 12px rgba(40,55,45,.1); }
.route-legend span { display: inline-flex; align-items: center; gap: 7px; }
.route-legend i { width: 26px; height: 0; border-top: 3px solid var(--accent); border-radius: 2px; }
.route-legend i.rel { border-top: 3px dotted #5f7d8c; }
.walker svg { width: 18px; height: 18px; fill: #fbf8ee; animation: step .4s ease-in-out infinite alternate; }
@keyframes step { from { transform: translateY(-1px) rotate(-4deg); } to { transform: translateY(1px) rotate(4deg); } }

/* ─── 抵達 ─── */
.arrive { position: fixed; left: 50%; top: 20%; z-index: 20; transform: translateX(-50%); width: min(560px, 92vw); text-align: center; pointer-events: none; }
.arrive h2 { font: 700 clamp(34px, 6vw, 52px)/1.2 var(--serif); letter-spacing: .12em; color: var(--ink); text-shadow: 0 2px 0 #fbf8ee, 0 0 18px rgba(251,248,238,.95); animation: pop .5s cubic-bezier(.2,1.6,.4,1); }
.arrive p { margin-top: 6px; font: 600 18px/1.4 var(--serif); color: var(--ink-2); text-shadow: 0 0 12px rgba(251,248,238,.95); }
.arrive .names { display: inline-block; margin-top: 10px; padding: 8px 16px; font: 600 20px/1.4 var(--latin); background: rgba(251,248,238,.95); border-radius: 12px; box-shadow: 0 6px 18px rgba(40,55,45,.15); }
.arrive .stars { margin-top: 10px; font-size: 40px; letter-spacing: 6px; }
.arrive .stars span { display: inline-block; color: var(--star); text-shadow: 0 3px 10px rgba(217,154,62,.4); opacity: 0; animation: pop .45s cubic-bezier(.2,1.6,.4,1) forwards; }
.arrive .stars span.lost { color: #d4d8cc; text-shadow: none; }
@keyframes pop { from { opacity: 0; transform: scale(.3); } to { opacity: 1; transform: scale(1); } }

/* ─── 故事卡、結算 ─── */
.modal { position: fixed; inset: 0; z-index: 25; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(40,55,45,.4); backdrop-filter: blur(3px); animation: rise .3s ease; }
.story-card { width: min(460px, 100%); max-height: calc(100svh - 32px); display: flex; flex-direction: column; overflow: hidden; background: var(--card); border-radius: 20px; box-shadow: 0 24px 60px rgba(40,55,45,.3); animation: flip .55s cubic-bezier(.2,.8,.2,1); }
@keyframes flip { from { opacity: 0; transform: perspective(900px) rotateY(-70deg) scale(.9); } to { opacity: 1; transform: none; } }
.story-card img { flex: none; display: block; width: 100%; aspect-ratio: 16 / 10; max-height: 38svh; object-fit: cover; background: #e3e6dc; }
.story-body { flex: 1; min-height: 0; overflow-y: auto; padding: 20px 24px 24px; }
.badge { display: inline-block; padding: 4px 12px; font-size: 12px; font-weight: 600; letter-spacing: .14em; color: #fbf8ee; background: var(--accent); border-radius: 999px; }
.story-body h3 { margin-top: 10px; font: 700 26px/1.3 var(--serif); letter-spacing: .05em; }
.story-body .sub { margin-top: 4px; font-size: 13px; color: var(--muted); }
.story-body .text { margin-top: 12px; font: 400 16px/1.9 var(--serif); }
.story-body .carry { margin-top: 14px; padding: 12px 14px; border-radius: 12px; background: #f1e6d4; font-size: 14px; line-height: 1.7; color: #6b4524; }
.story-body .carry strong { font-family: var(--latin); font-size: 16px; }
.story-body .move { margin-top: 12px; padding: 14px 16px; border-radius: 14px; background: #e9eff0; }
.story-body .move b { display: block; font: 600 16px/1.5 var(--serif); color: #2f6584; }
.story-body .move p { margin-top: 6px; font-size: 14px; line-height: 1.8; color: var(--ink-2); }
.story-body .note { margin-top: 10px; font-size: 12px; color: var(--muted); }
.story-body .actions { margin-top: 20px; display: flex; justify-content: flex-end; }

.result { width: min(620px, 100%); max-height: calc(100svh - 32px); overflow-y: auto; padding: 32px 28px 28px; text-align: center; background: var(--card); border-radius: 22px; box-shadow: 0 24px 60px rgba(40,55,45,.3); animation: rise .45s ease; }
.result .big { margin-top: 8px; font: 700 54px/1.1 var(--serif); color: var(--star); }
.result .big small { font-size: 22px; color: var(--muted); }
.result h2 { margin-top: 8px; font: 700 28px/1.35 var(--serif); letter-spacing: .08em; }
.result .lead { margin-top: 12px; font: 400 15px/1.9 var(--serif); color: var(--ink-2); }
.album-title { margin-top: 24px; text-align: left; font: 600 15px/1.4 var(--serif); }
.album { margin-top: 10px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.album button { position: relative; overflow: hidden; border-radius: 12px; aspect-ratio: 3 / 4; background: #dfe3d8; box-shadow: 0 6px 14px rgba(40,55,45,.12); transition: transform .2s ease; text-align: left; }
.album button:hover { transform: translateY(-3px) rotate(-1deg); }
.album img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.album span { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 8px 8px; font: 600 12px/1.35 var(--serif); color: #fbf8ee; background: linear-gradient(transparent, rgba(30,40,33,.8)); }
.album em { position: absolute; top: 6px; right: 6px; font-style: normal; font-size: 11px; color: var(--star); background: rgba(251,248,238,.94); padding: 2px 6px; border-radius: 999px; }
.result .actions { margin-top: 24px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.end-bar { position: fixed; left: 50%; bottom: 20px; z-index: 10; transform: translateX(-50%); display: flex; gap: 10px; white-space: nowrap; }

@media (max-width: 760px) {
  .howto { grid-template-columns: 1fr; gap: 8px; margin: 22px 0 26px; }
  .howto div { display: flex; align-items: center; gap: 12px; padding: 10px 14px; text-align: left; }
  .howto b { margin: 0; flex: none; }
  .intro-card .lead { font-size: 15px; }
  .hud-pill { padding: 8px 12px; gap: 8px; font-size: 13px; }
  .pips i { width: 7px; height: 7px; }
  .maplibregl-ctrl-top-right { display: none; }
  .mission { left: 8px; right: 8px; bottom: 8px; width: auto; max-height: 48svh; padding: 14px; border-radius: 16px; }
  .mission-top { grid-template-columns: 48px 1fr auto; }
  .mission-top img { width: 48px; height: 48px; }
  .mission-top h2 { font-size: 19px; }
  .nameplate { margin-top: 10px; padding: 10px 12px; }
  .nameplate strong { font-size: 24px; }
  .task { font-size: 14px; }
  .village, .village i { width: 18px; height: 18px; }
  .village i { border-width: 2px; }
  .village .plate { padding: 2px 7px 3px; }
  .village .plate { display: none; }
  .village.is-viewing .plate, .village.is-correct .plate, .village.is-wrong .plate, .village.is-hint .plate, .village.flash .plate { display: block; z-index: 2; }
  .village .plate b, .village .plate em { font-size: 11px; }
  .plates { display: grid; }
  .nameplate strong { font-size: 22px; }
  .arrive { top: 12%; }
  .route-legend { display: none; }
  .album { gap: 6px; }
  .album span { font-size: 10px; padding: 14px 5px 5px; }
  .result { padding: 26px 16px 20px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition: none !important; }
}
</style>
</head>
<body>
<div id="map" aria-label="南澳舊部落與現今村落地圖"></div>

<!-- 開場 -->
<section class="screen" id="intro" aria-labelledby="intro-title">
  <div class="intro-card">

<script>
// ─── 資料：全部取自南澳虛擬博物館（migration-places.json、continuation.js 的 relations、knowledgeGraph.js） ───
// 只收博物館裡有出處的 8 組「舊部落 → 現今村落」，不自行推測其他配對。東岳村沒有對照資料，作為干擾選項。
// plate：村落門牌上的族語名，取自 migration-places.json 的 oldName。
const VILLAGES = {
  金岳村: { lon: 121.77785, lat: 24.47123, plate: 'Ryohen', oldName: 'Ryohen／流興社', info: '位於南澳北溪流域，主要居民與山區舊部落流興社（Ryohen／Ryuhing）關係密切。直到今天，族人仍會返回流興舊社尋根。' },
  武塔村: { lon: 121.7772, lat: 24.44335, plate: 'Hagaparis', oldName: 'Hagaparis 哈卡巴里斯', info: '位於南澳鄉中部，居民主要與舊武塔社及哈卡巴里斯等山區部落有歷史關係。這裡也是從平地進入南澳山區的重要位置，保留不少與祖居地、狩獵和山林生活相關的記憶。' },
  金洋村: { lon: 121.75108, lat: 24.42495, plate: 'Knyahan', oldName: 'Knyahan 金洋舊社', info: '位於南澳鄉南側、接近山區入口的位置，是進入和平北溪與舊金洋一帶的重要聚落。' },

  澳花村: { lon: 121.74304, lat: 24.33134, plate: 'Kumuyaw', oldName: 'Kumuyaw／莫瑤社', info: '位於南澳鄉最南端、和平溪出海口附近，是南澳泰雅族主要聚落之一。村內族人的祖先來自莫瑤等山區舊社。' },
  南澳村: { lon: 121.80336, lat: 24.4655, plate: "Gong'ao", oldName: "Gong'ao", info: '位於南澳鄉中心的大南澳平原，是鄉公所、學校與主要公共設施集中的地方。村內聚集來自庫巴博（K’babaw）、各姆姆（Kngungu）等不同舊社的族人，是南澳鄉行政與生活機能的核心。' },

};

// 第一關（name）：比對族語名門牌。第二關（detective）：翻村落名片打聽。

const TRIBES = [
  { id: '舊金洋', key: 'knyahan', mode: 'name', name: 'Knyahan', oldName: 'Knyahan', lon: 121.59384, lat: 24.41373, answer: '金洋村', photo: 'knyahan',
    info: '金洋族人的山區舊部落，位於和平北溪上游山區。' },
  { id: '比亞毫社', key: 'piyahaw', mode: 'name', name: 'Piyahaw', oldName: 'Piyahaw／比亞豪', lon: 121.53802, lat: 24.41695, answer: '碧侯村', photo: 'piyahaw',
    info: '碧候族人的重要舊部落，位於和平北溪上游河階地。' },
  { id: '莫瑤社', key: 'muyaw', mode: 'name', name: 'Muyaw', oldName: 'Muyaw／Kumuyaw', lon: 121.556661, lat: 24.403659, answer: '澳花村', photo: 'muyaw',
    info: '位在和平溪左岸山腰平坦地，跟各姆姆一樣是南澳很早就有人居住的古老部落，Muyaw 是「涉水」的意思。' },
  { id: '哈卡巴里斯', key: 'hagaparis', mode: 'name', name: 'Hagaparis', oldName: 'Hagaparis／Hkbalis', lon: 121.61432, lat: 24.4465, answer: '武塔村', photo: 'hagaparis',
    info: '位於和平北溪流域，是族人祖先長期生活的重要聚落。位在銘山東方、與流興社隔溪相望，末代頭目哈勇帶族人七天徒步返此祖靈之地。地形陡峭多斷崖，耕地不多，相傳族人擅長疊石造梯田，最多可疊十幾層平台。' },
  { id: 'Ryohen（流興）', key: 'ryohen', mode: 'name', name: 'Ryohen', oldName: 'Ryohen／流興社', lon: 121.63211, lat: 24.44615, answer: '金岳村', photo: 'ryohen',
    info: '金岳的舊部落，位於和平溪流域山區。因當地盛產一種植物而得名，是南澳群對外交通的樞紐，也曾是外部落的行政中心。' },
  { id: '奎諾斯社', key: 'kinus', mode: 'detective', name: 'Kinus', oldName: 'Kinus', lon: 121.634739, lat: 24.406684, answer: '金洋村', photo: 'knyahan',
    info: '位在和平溪左岸的一段山稜上，跟哥各朱社語言系統和遷徙過程都同源，兩社彼此緊鄰。',
    task: '線報：奎諾斯社的族人，跟你在第 1 站找到的<b>「舊金洋」</b>搬到了同一個村落。翻翻名片，看哪個村落的居民名冊裡有舊金洋？' },
  { id: '克魯模安／庫巴博', key: 'kbabaw', mode: 'detective', name: "K'bu／Kerumoan", oldName: "K'bu／Kerumoan", lon: 121.592151, lat: 24.422515, answer: '南澳村', photo: 'kbabaw',
    info: '一個部落分上下兩層，下層庫巴博、上層克魯模安，相傳是同一頭目的兩個兒子分別建立的。',
    task: '線報：有個村落的介紹裡，直接提到了<b>「庫巴博」</b>。翻翻名片，找出它！' },
  { id: '各姆姆社', key: 'kngungu', mode: 'detective', name: "Kb'bu／Kngungu", oldName: "Kb'bu／Kngungu", lon: 121.57817, lat: 24.400337, answer: '南澳村', photo: 'kngungu',
    info: '位在金洋南方山脊平台上，緊臨和平溪，是南澳群裡地勢最低的部落，曾是泰雅古社，後由巴博凱凱遷來的族人重新建社。',
    task: '線報：各姆姆的族語名是 <b>Kngungu</b>。哪張村落名片提到了「各姆姆」或「Kngungu」？' },
];
const FIRST_DETECTIVE = TRIBES.findIndex(t => t.mode === 'detective');

// 有路線檔（GPX）的 4 組用真實路線，其他用虛線示意。
// 莫瑤社的路線檔（g_aohua）終點是比亞毫社山、沒經過莫瑤社，暫時改用虛線。
let routes = {};
const LABEL_SIDE = { 金岳村: 'left', 碧侯村: 'up', 南澳村: 'right', 東岳村: 'left' };

// ─── 遊戲狀態 ───
const state = { round: 0, stars: 0, streak: 0, wrong: 0, viewing: null, seen: new Set(), results: [], busy: false, playing: false };

// 找出兩個名字共同的最長片段，用來在畫面上標出「名字被帶下山」的部分
function commonPart(a, b) {
  const x = a.toLowerCase(), y = b.toLowerCase();
  let best = '';
  for (let i = 0; i < x.length; i++) for (let j = i + best.length + 1; j <= x.length; j++) {
    const s = x.slice(i, j); if (y.includes(s)) best = s; else break;
  }
  return best.length >= 3 ? best : '';
}
function markPart(word, part) {
  if (!part) return esc(word);
  const i = word.toLowerCase().indexOf(part);
  return esc(word.slice(0, i)) + '<mark>' + esc(word.slice(i, i + part.length)) + '</mark>' + esc(word.slice(i + part.length));
}

// ─── 地圖 ───
const map = new maplibregl.Map({
  container: 'map',
  style: {
    version: 8,
    glyphs: 'https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf',
    sources: {
      taiwan: { type: 'geojson', data: 'data/taiwan-boundary.geojson' },
      openmaptiles: { type: 'vector', url: 'https://tiles.openfreemap.org/planet', attribution: '<a href="https://openfreemap.org/" target="_blank">OpenFreeMap</a> · <a href="https://www.openstreetmap.org/copyright" target="_blank">© OpenStreetMap contributors</a>' },
    },
    layers: [
      { id: 'paper-ocean', type: 'background', paint: { 'background-color': '#dce5e3' } },
      { id: 'taiwan-land', type: 'fill', source: 'taiwan', paint: { 'fill-color': '#eeeee5' } },
      { id: 'forest', type: 'fill', source: 'openmaptiles', 'source-layer': 'landcover', filter: ['in', 'class', 'wood', 'grass', 'scrub'], paint: { 'fill-color': '#bfcbb9', 'fill-opacity': .65 } },
      { id: 'residential', type: 'fill', source: 'openmaptiles', 'source-layer': 'landuse', filter: ['==', 'class', 'residential'], paint: { 'fill-color': '#e7e5dc', 'fill-opacity': .7 } },
      { id: 'water', type: 'fill', source: 'openmaptiles', 'source-layer': 'water', paint: { 'fill-color': '#dce5e3' } },
      { id: 'waterways', type: 'line', source: 'openmaptiles', 'source-layer': 'waterway', paint: { 'line-color': '#a9c1c1', 'line-opacity': .8, 'line-width': ['interpolate', ['linear'], ['zoom'], 6, .3, 12, 1.5] } },
      { id: 'coastline', type: 'line', source: 'taiwan', paint: { 'line-color': '#91a69e', 'line-width': .8, 'line-opacity': .5 } },
      { id: 'major-roads', type: 'line', source: 'openmaptiles', 'source-layer': 'transportation', filter: ['in', 'class', 'motorway', 'trunk', 'primary', 'secondary'], paint: { 'line-color': '#b5ac97', 'line-opacity': .5, 'line-width': ['interpolate', ['linear'], ['zoom'], 6, .45, 12, 1.5] } },
    ],
  },
  center: [121.68, 24.43], zoom: 10.6,
  attributionControl: { compact: true }, dragRotate: false, pitchWithRotate: false, touchPitch: false,
});
map.touchZoomRotate.disableRotation();
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');

const isMobile = () => innerWidth <= 760;
function padding() {
  return isMobile()
    ? { top: 70, bottom: Math.round(innerHeight * .48) + 10, left: 24, right: 90 }
    : { top: 80, bottom: 70, left: 440, right: 130 };
}
function fitAll(duration = 900) {
  const b = new maplibregl.LngLatBounds();
  TRIBES.forEach(t => b.extend([t.lon, t.lat]));
  Object.values(VILLAGES).forEach(v => b.extend([v.lon, v.lat]));
  map.fitBounds(b, { padding: padding(), duration });
}

const oldMarkers = {};
TRIBES.forEach(t => {
  const el = document.createElement('div');
  el.className = 'old-dot';
  el.innerHTML = `<i></i><span>${t.id}</span>`;
  oldMarkers[t.key] = el;
  new maplibregl.Marker({ element: el, anchor: 'center' }).setLngLat([t.lon, t.lat]).addTo(map);
});

const villageEls = {};
Object.entries(VILLAGES).forEach(([name, v]) => {
  const el = document.createElement('button');
  el.type = 'button';
  el.className = 'village' + (LABEL_SIDE[name] ? ' lbl-' + LABEL_SIDE[name] : '');
  el.setAttribute('aria-label', `${name}，族語名 ${v.plate}`);
  el.innerHTML = `<i></i><span class="plate"><b>${name}</b><em>${v.plate}</em></span>`;
  el.addEventListener('click', e => { e.stopPropagation(); onVillage(name); });
  villageEls[name] = el;
  new maplibregl.Marker({ element: el, anchor: 'center' }).setLngLat([v.lon, v.lat]).addTo(map);
});

const walkerEl = document.createElement('div');
walkerEl.className = 'walker';
walkerEl.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="13" cy="4" r="2.2"/><path d="M10.2 8.3 7 9.8V14h2v-2.9l1.4-.6-1.6 8.2L4.6 18l-.4 2 6.2 1.2 1.1-5.3 2.1 2V24h2v-7.3l-2.1-2 .6-3.1A7 7 0 0 0 19 14v-2a5 5 0 0 1-4.3-2.5l-1-1.6A2 2 0 0 0 12 7c-.6 0-1.2.4-1.8 1.3Z"/></svg>';
const walker = new maplibregl.Marker({ element: walkerEl, anchor: 'center' });

map.on('load', async () => {
  fitAll(0);
  try { routes = await (await fetch('data/routes.json')).json(); } catch (e) { routes = {}; }
  map.addSource('routes', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
  map.addLayer({ id: 'route-glow', type: 'line', source: 'routes', filter: ['==', ['get', 'real'], true], layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': '#b27745', 'line-width': 9, 'line-opacity': ['case', ['get', 'active'], .25, .08] } });
  map.addLayer({ id: 'route-solid', type: 'line', source: 'routes', filter: ['==', ['get', 'real'], true], layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': '#b27745', 'line-width': ['case', ['get', 'active'], 4, 2.2], 'line-opacity': ['case', ['get', 'active'], 1, .5] } });
  map.addLayer({ id: 'route-dash', type: 'line', source: 'routes', filter: ['==', ['get', 'real'], false], layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': '#5f7d8c', 'line-width': ['case', ['get', 'active'], 3.2, 2.2], 'line-dasharray': [0, 2.2], 'line-opacity': ['case', ['get', 'active'], .95, .5] } });
});
addEventListener('resize', () => { if (!state.busy) fitAll(0); });

const solvedKeys = () => new Set(state.results.map(r => r.key));
// 沒有路線紀錄的組合：畫一條往上拱的弧線，只表示「搬遷關係」，刻意不像一條路
function arc(a, b) {
  const [x1, y1] = a, [x2, y2] = b;
  const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy);
  let nx = -dy / len, ny = dx / len;
  if (ny < 0) { nx = -nx; ny = -ny; }
  const cx = (x1 + x2) / 2 + nx * len * .28, cy = (y1 + y2) / 2 + ny * len * .28;
  return Array.from({ length: 61 }, (_, i) => {
    const s = i / 60, r = 1 - s;
    return [r * r * x1 + 2 * r * s * cx + s * s * x2, r * r * y1 + 2 * r * s * cy + s * s * y2];
  });
}
const routeCoords = t => routes[t.key] || arc([t.lon, t.lat], [VILLAGES[t.answer].lon, VILLAGES[t.answer].lat]);
function sliceLine(coords, p) {
  if (coords.length < 2) return coords;
  const seg = []; let total = 0;
  for (let i = 1; i < coords.length; i++) { const d = Math.hypot(coords[i][0] - coords[i - 1][0], coords[i][1] - coords[i - 1][1]); seg.push(d); total += d; }
  let want = total * Math.max(.001, p); const out = [coords[0]];
  for (let i = 0; i < seg.length; i++) {
    if (want >= seg[i]) { out.push(coords[i + 1]); want -= seg[i]; continue; }
    const r = want / seg[i];
    out.push([coords[i][0] + (coords[i + 1][0] - coords[i][0]) * r, coords[i][1] + (coords[i + 1][1] - coords[i][1]) * r]);
    break;
  }
  return out;
}
function setRoutes(activeKey, partial = 1) {
  const src = map.getSource('routes'); if (!src) return;
  const keys = solvedKeys();
  src.setData({ type: 'FeatureCollection', features: TRIBES.filter(t => keys.has(t.key) || t.key === activeKey).map(t => {
    const full = routeCoords(t);
    return { type: 'Feature', properties: { real: !!routes[t.key], active: t.key === activeKey }, geometry: { type: 'LineString', coordinates: t.key === activeKey && partial < 1 ? sliceLine(full, partial) : full } };
  }) });
}
// 小人沿路線走到新家，路線跟著畫出來
function walk(t) {
  return new Promise(resolve => {
    const coords = routeCoords(t);
    const b = new maplibregl.LngLatBounds(); coords.forEach(c => b.extend(c));
    map.fitBounds(b, { padding: isMobile() ? { top: 90, bottom: Math.round(innerHeight * .3), left: 40, right: 90 } : { top: 160, bottom: 100, left: 140, right: 160 }, maxZoom: 11.6, duration: 800 });
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    setTimeout(() => {
      walkerEl.classList.toggle('spark', !routes[t.key]);
      walker.setLngLat(coords[0]).addTo(map);
      const duration = reduce ? 1 : (routes[t.key] ? 2600 : 1600), start = performance.now();
      const step = now => {
        const p = Math.min(1, (now - start) / duration);
        const e = p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
        const line = sliceLine(coords, e);
        setRoutes(t.key, e);
        walker.setLngLat(line[line.length - 1]);
        if (p < 1) requestAnimationFrame(step); else { walker.remove(); resolve(); }
      };
      requestAnimationFrame(step);
    }, reduce ? 0 : 850);
  });
}

// ─── 畫面 ───
const $ = id => document.getElementById(id);
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function renderHud() {
  const level = state.round < FIRST_DETECTIVE ? '第一關' : '第二關';
  $('round-label').textContent = state.round < TRIBES.length ? (isMobile() ? `第 ${state.round + 1} 站` : `${level} · 第 ${state.round + 1} 站`) : '全部抵達';
  $('pips').innerHTML = TRIBES.map((_, i) => (i === FIRST_DETECTIVE ? '<span class="gap"></span>' : '') + `<i class="${i < state.round ? 'done' : i === state.round ? 'now' : ''}"></i>`).join('');
  $('score').textContent = `★ ${state.stars}`;
  $('streak').hidden = state.streak < 2;
  $('streak').textContent = isMobile() ? `🔥${state.streak}` : `🔥 連續 ${state.streak}`;
}
const roundStars = () => Math.max(1, 3 - state.wrong);
// 村落的居民名冊：已經在遊戲中找到的舊部落
const roster = name => TRIBES.filter(t => t.answer === name && solvedKeys().has(t.key)).map(t => t.id);

function renderMission(enter, toast = '') {
  const t = TRIBES[state.round];
  const s = roundStars();
  const head = `<div class="mission-top"><img src="photos/${t.photo}.jpg" alt=""><div><small>第 ${state.round + 1} 站 · 舊部落</small><h2>${esc(t.id)}</h2></div><div class="round-stars" aria-label="這一站還能拿 ${s} 顆星">${[0, 1, 2].map(i => `<span class="${i < s ? '' : 'lost'}">★</span>`).join('')}</div></div>`;
  let body;
  if (t.mode === 'name') {
    body = `<div class="nameplate"><small>族語名</small><strong>${esc(t.name)}</strong></div>
      <p class="task">🔗 名字連連看！<br>找出族語名拼法最接近的<em>村落</em>，把它們連起來！</p>`;
  } else {
    const v = state.viewing && VILLAGES[state.viewing];
    const r = state.viewing ? roster(state.viewing) : [];
    body = `<p class="task">${t.task}</p>` + (v
      ? `<div class="vcard"><div class="vcard-head"><b>📇 ${esc(state.viewing)}</b><span>${esc(v.plate)}</span></div><p>${esc(v.info)}</p>
          <div class="roster"><b>居民名冊（已找到）：</b>${r.length ? r.map(esc).join('、') : '還沒有'}</div>
          <div class="btns"><button type="button" class="btn-main small" id="pick">就是這裡！</button><button type="button" class="btn-ghost small" id="close-card">再看看別家</button></div></div>`
      : `<p class="visited">👉 點任一個村落，翻開它的名片。${state.seen.size ? `已翻過 ${state.seen.size} 張。` : ''}</p>`);
  }
  const plates = `<div class="plates" aria-label="村落門牌">${Object.entries(VILLAGES).map(([n, v]) => `<button type="button" data-v="${n}" class="${t.mode === 'detective' && state.seen.has(n) ? 'seen' : ''}${n === state.viewing ? ' viewing' : ''}"><b>${n}</b><em>${esc(v.plate)}</em></button>`).join('')}</div>`;
  const m = $('mission');
  m.innerHTML = head + body + (toast ? `<div class="toast${toast.startsWith('✓') ? ' good' : ''}">${toast}</div>` : '') + plates;
  m.querySelectorAll('.plates button').forEach(btn => btn.addEventListener('click', () => {
    const n = btn.dataset.v, el = villageEls[n];
    el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
    setTimeout(() => el.classList.remove('flash'), 1400);
    onVillage(n);
  }));
  if (t.mode === 'detective' && state.viewing) {
    $('pick').addEventListener('click', () => answer(state.viewing));
    $('close-card').addEventListener('click', () => { state.viewing = null; markViewing(); renderMission(); });
  }
  if (enter) { m.classList.remove('enter'); void m.offsetWidth; m.classList.add('enter'); m.scrollTop = 0; }
}
function markViewing() {
  Object.entries(villageEls).forEach(([n, el]) => {
    el.classList.toggle('is-viewing', n === state.viewing);
    el.classList.toggle('is-seen', TRIBES[state.round]?.mode === 'detective' && state.seen.has(n) && n !== state.viewing);
  });
}

function startRound() {
  if (state.round === FIRST_DETECTIVE && !state.level2Shown) { state.level2Shown = true; $('mission').hidden = true; $('level2').hidden = false; renderHud(); setRoutes(null); fitAll(); return; }
  const t = TRIBES[state.round];
  state.wrong = 0; state.busy = false; state.viewing = null; state.seen = new Set();
  Object.values(villageEls).forEach(el => el.classList.remove('is-wrong', 'is-correct', 'is-hint', 'is-viewing', 'is-seen'));
  Object.entries(oldMarkers).forEach(([k, el]) => el.classList.toggle('is-active', k === t.key));
  document.body.classList.add('playing');
  $('mission').hidden = false;
  renderHud(); renderMission(true);
  setRoutes(null); fitAll();
}

function onVillage(name) {
  if (!state.playing || state.busy) return;
  const t = TRIBES[state.round];
  if (t.mode === 'name') { answer(name); return; }
  // 第二關：點村落只是翻名片，不算作答
  state.viewing = name; state.seen.add(name);
  markViewing(); renderMission();
  if (isMobile()) $('mission').scrollTop = 0;
}

function answer(name) {
  const t = TRIBES[state.round];
  const el = villageEls[name];
  if (name === t.answer) { win(t, el); return; }
  state.wrong++; state.streak = 0;
  el.classList.remove('is-wrong'); void el.offsetWidth; el.classList.add('is-wrong');
  setTimeout(() => el.classList.remove('is-wrong'), 700);
  const m = $('mission'); m.classList.remove('shake'); void m.offsetWidth; m.classList.add('shake');
  let tip;
  if (t.mode === 'name') {
    const plate = VILLAGES[name].plate;
    tip = state.wrong >= 2
      ? `<b>${esc(plate)} 不太像喔！</b>地圖上閃爍的村落就是答案，看看它的門牌。`
      : `<b>${esc(plate)} 跟 ${esc(t.name)} 不太像喔！</b>把兩個名字念出來比比看，找拼法最接近的那塊門牌。`;
  } else {
    state.viewing = null;
    tip = state.wrong >= 2
      ? `<b>不是${esc(name)}！</b>地圖上閃爍的村落就是答案，翻開它的名片看看。`
      : `<b>不是${esc(name)}！</b>再仔細讀讀線報，翻別家的名片找找看。`;
  }
  if (state.wrong >= 2) villageEls[t.answer].classList.add('is-hint');
  markViewing(); renderHud(); renderMission(false, tip);
}

async function win(t, el) {
  state.busy = true;
  const earned = roundStars();
  state.stars += earned; state.streak++;
  state.results.push({ key: t.key, stars: earned });
  state.viewing = null; markViewing();
  el.classList.remove('is-hint'); el.classList.add('is-correct');
  document.body.classList.remove('playing');
  oldMarkers[t.key].classList.remove('is-active');
  oldMarkers[t.key].classList.add('is-solved');
  $('mission').hidden = true;
  renderHud();
  await walk(t);
  const v = VILLAGES[t.answer];
  const part = t.mode === 'name' ? commonPart(t.name, v.plate) : '';
  const arrive = $('arrive');
  arrive.innerHTML = `<h2>抵達！</h2><p>${esc(t.id)} → ${esc(t.answer)}</p>`
    + (part ? `<div class="names">${markPart(t.name, part)} → ${markPart(v.plate, part)}</div>` : '')
    + (routes[t.key] ? '' : '<p style="font-size:14px;font-weight:500">點狀弧線：實際遷徙路徑尚未找到</p>')
    + `<div class="stars">${[0, 1, 2].map(i => `<span class="${i < earned ? '' : 'lost'}" style="animation-delay:${.15 + i * .18}s">★</span>`).join('')}</div>`;
  arrive.hidden = false;
  $('score').classList.remove('bump'); void $('score').offsetWidth; $('score').classList.add('bump');
  await new Promise(r => setTimeout(r, part ? 2000 : 1500));
  arrive.hidden = true;
  showStory(t, earned, true);
}

function showStory(t, earned, inGame, onClose) {
  const v = VILLAGES[t.answer];
  const last = state.round >= TRIBES.length - 1;
  const part = t.mode === 'name' ? commonPart(t.name, v.plate) : '';
  const modal = $('story-modal');
  modal.innerHTML = `<article class="story-card" role="dialog" aria-modal="true" aria-label="${esc(t.id)}故事卡">
    <img src="photos/${t.photo}.jpg" alt="${esc(t.id)}舊部落照片">
    <div class="story-body">
      <span class="badge">${inGame ? '解鎖故事卡' : '故事卡'} · ${'★'.repeat(earned)}</span>
      <h3>${esc(t.id)}</h3>
      <p class="sub">族語名 ${esc(t.oldName)}</p>
      <p class="text">${esc(t.info)}</p>
      ${part ? `<div class="carry">名字跟著族人搬下山：<strong>${markPart(t.name, part)}</strong> → <strong>${markPart(v.plate, part)}</strong></div>` : ''}
      <div class="move"><b>後來搬到 ${esc(t.answer)}（${esc(v.oldName)}）</b><p>${esc(v.info)}</p></div>
      <p class="note">${routes[t.key] ? '地圖上的路線依遷村路線圖繪製。' : '目前還沒有找到這組的實際遷徙路徑，地圖上的點狀弧線只表示「從這裡搬到那裡」，不是族人實際走過的路。'}</p>
      <div class="actions"><button type="button" class="btn-main" id="story-next">${inGame ? (last ? '看結算 →' : '收進收藏冊，前往下一站 →') : '關閉'}</button></div>
    </div></article>`;
  modal.hidden = false;
  $('story-next').focus();
  $('story-next').addEventListener('click', () => {
    modal.hidden = true;
    if (onClose) { onClose(); return; }
    if (!inGame) return;
    state.round++;
    if (state.round >= TRIBES.length) finish(); else startRound();
  });
}

function titleFor(s) {
  if (s >= 24) return '滿星！南澳遷徙路線全制霸';
  if (s >= 19) return '熟門熟路的南澳嚮導';
  if (s >= 13) return '越走越熟的探路者';
  return '剛踏上遷徙之路的新手';
}
function finish() {
  state.playing = false;
  $('mission').hidden = true;
  document.body.classList.remove('playing');
  Object.values(oldMarkers).forEach(el => el.classList.remove('is-active'));
  Object.values(villageEls).forEach(el => el.classList.remove('is-wrong', 'is-correct', 'is-hint', 'is-viewing', 'is-seen'));
  renderHud(); setRoutes(null); fitAll();
  showResult();
}
function showResult() {
  const modal = $('result-modal');
  const byKey = Object.fromEntries(state.results.map(r => [r.key, r.stars]));
  modal.innerHTML = `<section class="result" role="dialog" aria-modal="true" aria-labelledby="result-title">
    <div class="eyebrow">8 個舊部落都找到新家了</div>
    <div class="big">★ ${state.stars}<small> / 24</small></div>
    <h2 id="result-title">${titleFor(state.stars)}</h2>
    <p class="lead">南澳泰雅族人從和平溪、和平北溪一帶的山區舊部落，一步步遷到山下的村落。直到今天，族人仍會回到舊社尋根，舊部落的名字也留在村落的族語名裡。</p>
    <p class="album-title">故事收藏冊 · 點卡片再讀一次</p>
    <div class="album">${TRIBES.map(t => `<button type="button" data-key="${t.key}"><img src="photos/${t.photo}.jpg" alt=""><em>${'★'.repeat(byKey[t.key] || 0)}</em><span>${esc(t.id)}<br>→ ${esc(t.answer)}</span></button>`).join('')}</div>
    <div class="actions"><button type="button" class="btn-ghost" id="see-map">看遷徙總覽地圖</button><button type="button" class="btn-main" id="replay">${state.stars >= 24 ? '再玩一次' : '再挑戰滿星'}</button></div>
  </section>`;
  modal.hidden = false;
  $('end-bar').hidden = true;
  modal.querySelectorAll('.album button').forEach(b => b.addEventListener('click', () => {
    const t = TRIBES.find(x => x.key === b.dataset.key);
    modal.hidden = true;
    showStory(t, byKey[t.key], false, () => { modal.hidden = false; });
  }));
  $('see-map').addEventListener('click', () => { modal.hidden = true; $('end-bar').hidden = false; });
  $('replay').addEventListener('click', restart);
}
function restart() {
  Object.assign(state, { round: 0, stars: 0, streak: 0, results: [], playing: true, busy: false, level2Shown: true });
  Object.values(oldMarkers).forEach(el => el.classList.remove('is-solved'));
  $('result-modal').hidden = true; $('end-bar').hidden = true;
  startRound();
}

$('start').addEventListener('click', () => {
  $('intro').hidden = true; $('hud').hidden = false; $('route-legend').hidden = false;
  state.playing = true;
  startRound();
});
$('go-level2').addEventListener('click', () => { $('level2').hidden = true; startRound(); });
$('open-result').addEventListener('click', showResult);
$('replay-2').addEventListener('click', restart);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('story-modal').hidden) $('story-next')?.click();
});
</script>
</body>
</html>
